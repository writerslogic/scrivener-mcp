# Competitor comparison data for the "Why This One?" section in README.md
# Static feature rows are maintained here manually.
# Star counts, fork counts, and activity status are updated automatically by
# .github/workflows/update-comparison.yml on a weekly schedule.
#
# To add a competitor: add an entry under `repos` and fill in the feature columns below.
# To add a feature row: add an entry under `features` with the same competitor keys.

repos:
  scrivener-mcp:
    github: writerslogic/scrivener-mcp
    npm: scrivener-mcp
    display: "**scrivener-mcp**"
  jiayun:
    github: jiayun-ai/scrivener-mcp
    display: "jiayun"
  zaphodsdad:
    github: zaphodsdad/Scrivener-MCP
    display: "zaphodsdad"
  others:
    github: null
    display: "others"

# Feature rows — edit these manually when capabilities change.
# Values: free text, "yes", "no", "partial", "—"
features:
  - label: Document read/write
    scrivener-mcp: "53 tools"
    jiayun: "29 tools"
    zaphodsdad: "read-only"
    others: "basic"

  - label: RTF / rich text support
    scrivener-mcp: "yes"
    jiayun: "no"
    zaphodsdad: "no"
    others: "no"

  - label: Writing analysis
    scrivener-mcp: "readability, pacing, style, emotion"
    jiayun: "basic metrics"
    zaphodsdad: "no"
    others: "no"

  - label: Content enhancement
    scrivener-mcp: "12 types (filter words, verbs, show-don't-tell…)"
    jiayun: "no"
    zaphodsdad: "no"
    others: "no"

  - label: Semantic search (offline)
    scrivener-mcp: "vector + analogies + dream mode"
    jiayun: "no"
    zaphodsdad: "no"
    others: "no"

  - label: Character consistency check
    scrivener-mcp: "yes — finds contradictions across manuscript"
    jiayun: "no"
