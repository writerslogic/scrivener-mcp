name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '34 8 * * 2'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.14.0, 24.x]
        include:
          - os: ubuntu-latest
            node-version: 22.x
          - os: ubuntu-latest
            node-version: 26.x

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type checking
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Runtime policy
        run: node scripts/check-runtime-policy.mjs

      - name: Tool registry gate
        run: node scripts/check-tool-registry.mjs

      - name: Output-schema conformance gate
        run: node scripts/check-output-conformance.mjs

      - name: HMS fallback compatibility
        run: node scripts/check-hms-compatibility.mjs

      - name: Test
        run: npm test -- --testTimeout=30000

      - name: Installed package and protocol smoke
        run: node scripts/check-release-smoke.mjs

      - name: Real Redis backend compatibility
        if: runner.os == 'Linux' && matrix.node-version == '24.x'
        run: |
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends redis-server
          fi
          node scripts/check-redis-backend.mjs

      - name: Dashboard browser interactions
        if: runner.os == 'Linux' && matrix.node-version == '24.x'
        run: node scripts/check-dashboard.mjs

      - name: EPUBCheck validation
        if: runner.os == 'Linux' && matrix.node-version == '24.x'
        run: node scripts/check-epub-export.mjs

      - name: Dependency audit
        run: npm audit

  release-gate:
    name: Release verification
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete compatibility matrix
        env:
          MATRIX_RESULT: ${{ needs.build.result }}
        run: test "$MATRIX_RESULT" = success
