name: Windows configuration ACL diagnostic
on:
  push:
    branches: [diagnostics/windows-config-acl-20261103]
permissions:
  contents: read
jobs:
  acl:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.x
          check-latest: true
      - name: Compare permissions after staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'scrivener-acl-diagnostic'
          New-Item -ItemType Directory -Path $dir | Out-Null
          Push-Location $dir
          try {
            [IO.File]::WriteAllText((Join-Path $dir 'original.json'), '{"fixture":true}')
            $acl = Get-Acl 'original.json'
            $acl.SetAccessRuleProtection($true, $false)
            $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
            $rule = [System.Security.AccessControl.FileSystemAccessRule]::new($identity, 'FullControl', 'Allow')
            $acl.SetAccessRule($rule)
            Set-Acl 'original.json' $acl
            $before = (Get-Acl 'original.json').Sddl
            $env:ACL_DIAGNOSTIC_DIR = $dir
            node -e "process.chdir(process.env.ACL_DIAGNOSTIC_DIR);const fs=require('node:fs');fs.copyFileSync('original.json','copy.json');fs.writeFileSync('fresh.json','fixture',{mode:0o600});"
            if ($LASTEXITCODE -ne 0) { throw 'Node metadata experiment failed' }
            $copy = (Get-Acl 'copy.json').Sddl
            $fresh = (Get-Acl 'fresh.json').Sddl
            Set-Content -LiteralPath (Join-Path $dir 'original.json') -Stream 'fixture' -Value 'retained'
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeReplace {
            [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
            public static extern bool ReplaceFile(string replaced, string replacement, string backup, uint flags, IntPtr exclude, IntPtr reserved);
          }
          '@
            $ok = [NativeReplace]::ReplaceFile((Join-Path $dir 'original.json'), (Join-Path $dir 'fresh.json'), (Join-Path $dir 'backup.json'), 0, [IntPtr]::Zero, [IntPtr]::Zero)
            if (-not $ok) { throw ('ReplaceFile failed: ' + [Runtime.InteropServices.Marshal]::GetLastWin32Error()) }
            $after = (Get-Acl 'original.json').Sddl
            $stream = Get-Content -LiteralPath (Join-Path $dir 'original.json') -Stream 'fixture' -Raw
            [PSCustomObject]@{
              node = (node --version)
              protectedOriginal = (Get-Acl 'original.json').AreAccessRulesProtected
              copyDescriptorIdentical = $before -ceq $copy
              freshDescriptorIdentical = $before -ceq $fresh
              replacementDescriptorIdentical = $before -ceq $after
              replacementStreamRetained = $stream.Trim() -ceq 'retained'
              replacementContentCorrect = [IO.File]::ReadAllText((Join-Path $dir 'original.json')) -ceq 'fixture'
            } | ConvertTo-Json | Write-Output
          } finally {
            Pop-Location
            Remove-Item -Path $dir -Recurse -Force
          }
