name: Windows project-open timing diagnostic
on:
  push:
    branches: [diagnostics/windows-project-open-20261103]
permissions:
  contents: read
jobs:
  c2pa-rebuild:
    uses: ./.github/workflows/c2pa-build.yml
  timing:
    needs: c2pa-rebuild
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      SCRIVENER_DIAGNOSTIC_DIR: ${{ github.workspace }}\diagnostic-phases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: c2pa-binding
          path: assets/c2pa-binding
      - run: npm ci
      - name: Apply diagnostic-only instrumentation
        run: |
          New-Item -ItemType Directory -Path $env:SCRIVENER_DIAGNOSTIC_DIR -Force | Out-Null
          node scripts/diagnostics/windows-project-open.mjs
          git diff -- src tests/unit/handlers/tool-protocol.test.ts | Out-File -Encoding utf8 diagnostic-phases/instrumentation.diff
      - name: Run full suite with unchanged deadlines and workers
        run: npm test -- --testTimeout=30000
      - name: Retain timing and instrumentation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-project-open-phases
          path: diagnostic-phases
          if-no-files-found: error
