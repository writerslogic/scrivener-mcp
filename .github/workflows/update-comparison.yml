name: Update Comparison Table

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PyYAML
        run: |
          pip install --disable-pip-version-check --no-binary :all: --require-hashes \
            -r .github/workflows/pyyaml-requirements.txt

      - name: Test comparison refresh
        run: python3 -B -m unittest discover -s scripts/tests

      - name: Update comparison table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-comparison.py

      # main requires status checks on every ref update, so this can no longer
      # push directly (that always failed: "2 of 2 required status checks are
      # expected"). Open a PR instead, same as the changelog workflow.
      - name: Open comparison-table PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore: update comparison table stats'
          title: 'chore: update comparison table stats'
          body: Auto-generated weekly refresh of stars/forks/activity/version stats in the "Why This One?" table.
          branch: auto/comparison-update
          delete-branch: true
          add-paths: README.md
