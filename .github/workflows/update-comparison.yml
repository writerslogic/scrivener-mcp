name: Update Comparison Table

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: |
          pip install --disable-pip-version-check --no-binary :all: --require-hashes \
            -r .github/workflows/pyyaml-requirements.txt

      - name: Test comparison refresh
        run: python3 -B -m unittest discover -s scripts/tests

      - name: Update comparison table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-comparison.py

      - name: Create maintenance App token
        if: vars.MAINTENANCE_APP_CLIENT_ID != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MAINTENANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Explain workflow approval requirement
        if: vars.MAINTENANCE_APP_CLIENT_ID == ''
        run: echo '::notice::Configure MAINTENANCE_APP_CLIENT_ID and MAINTENANCE_APP_PRIVATE_KEY to run maintenance PR checks without manual approval.'

      - name: Open comparison-table PR
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          commit-message: 'chore: update comparison table stats'
          title: 'chore: update comparison table stats'
          body: Auto-generated weekly refresh of stars/forks/activity/version stats in the "Why This One?" table.
          branch: auto/comparison-update
          delete-branch: true
          add-paths: README.md
