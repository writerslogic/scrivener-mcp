name: Extension build

# Builds the Claude Desktop extension on pull requests that could break it, so a release
# (which depends on this build) never fails for the first time at tag time.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-mcpb.sh'
      - 'scripts/stage-bundle.sh'
      - 'assets/draftbridge/icon.png'
      - 'assets/infographics/capability-map.png'
      - 'package-lock.json'
      - 'src/index.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcpb:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and verify the extension
        run: scripts/build-mcpb.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: dist-mcpb/*.mcpb
          retention-days: 7
