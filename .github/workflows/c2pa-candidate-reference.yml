name: C2PA candidate reference generation

on:
  push:
    branches: [diagnostic/c2pa-macro-reference]

permissions:
  contents: read

jobs:
  build:
    name: Independent reference build ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_BUILD_JOBS: 3
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/c2pa-binding/target
      SCRIVENER_DISABLE_KEY_DISCOVERY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.x
          check-latest: true
      - name: Install pinned build tools
        run: |
          npm ci --ignore-scripts
          rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack --version 0.14.0 --locked
      - name: Generate and validate candidate
        run: |
          mkdir -p logs/c2pa-candidate
          git rev-parse HEAD > logs/c2pa-candidate/checkout.sha
          rustc --version --verbose > logs/c2pa-candidate/compiler.txt
          cargo --version --verbose > logs/c2pa-candidate/cargo.txt
          node --version > logs/c2pa-candidate/node.txt
          npm run build:c2pa > logs/c2pa-candidate/build.log 2>&1
          node scripts/check-c2pa-binding.mjs
          cargo metadata --locked --manifest-path native/c2pa-binding/Cargo.toml --format-version 1 > logs/c2pa-candidate/cargo-metadata.json
          cargo tree --locked --manifest-path native/c2pa-binding/Cargo.toml > logs/c2pa-candidate/cargo-tree.txt
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const m=JSON.parse(fs.readFileSync("logs/c2pa-candidate/cargo-metadata.json")); assert(!m.packages.some(p => p.name === "proc-macro-error" || p.name === "proc-macro-error-attr"));'
          git diff --exit-code -- native/c2pa-binding/Cargo.lock
          npm run build
          npm test -- --runInBand tests/unit/scripts/c2pa-binding.test.ts tests/unit/scripts/c2pa-binding-build.test.ts tests/unit/services/content-credentials-sdk.test.ts
          git diff -- assets/c2pa-binding > logs/c2pa-candidate/artifact.diff
      - name: Retain generated candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c2pa-candidate-${{ matrix.replica }}
          path: assets/c2pa-binding
          if-no-files-found: error
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c2pa-candidate-evidence-${{ matrix.replica }}
          path: logs/c2pa-candidate
          if-no-files-found: error
  compare:
    name: Compare independently generated candidates
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: c2pa-candidate-a
          path: candidate-a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: c2pa-candidate-b
          path: candidate-b
      - run: diff -r candidate-a candidate-b
