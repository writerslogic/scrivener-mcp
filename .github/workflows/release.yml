name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --testTimeout=30000

      - name: Publish to npm (provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish metadata to the official MCP Registry so downstream directories
      # (mcp.so, PulseMCP, ...) pick it up. Authenticates with the workflow's
      # OIDC token (needs id-token: write, above) for the io.github.writerslogic
      # namespace. server.json is stamped to the released version so it always
      # matches the npm package the registry verifies against.
      - name: Publish to MCP Registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('server.json'));s.version='${VERSION}';s.packages.forEach(p=>p.version='${VERSION}');fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n')"
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # No .tgz asset: this repo uses immutable releases, so assets cannot be
      # attached after the release is published. The package tarball is already
      # distributed via npm (npm install pulls the identical artifact), so a
      # GitHub-release copy is redundant.
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          draft: false
          prerelease: false
