name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

jobs:
  # Release assets must exist before the release is created: this repo uses immutable
  # releases, so nothing can be attached afterwards.
  mcpb:
    if: github.repository == 'writerslogic/scrivener-mcp'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          check-latest: true
          cache: 'npm'

      - name: Verify the exact protected release source
        timeout-minutes: 3
        run: node scripts/check-release-candidate.mjs source
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: npm ci

      - name: Build the Claude Desktop extension
        run: scripts/build-mcpb.sh

      - name: Verify runtime policy and bundle versions
        run: |
          node scripts/check-runtime-policy.mjs
          node scripts/check-release-candidate.mjs artifacts --directory dist-mcpb --stamp-registry

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: |
            dist-mcpb/*.mcpb
            dist-mcpb/*.sha256
          if-no-files-found: error

  release:
    if: github.repository == 'writerslogic/scrivener-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: mcpb
    environment: npm
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify the exact protected release source
        timeout-minutes: 3
        run: node scripts/check-release-candidate.mjs source
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Runtime policy
        run: node scripts/check-runtime-policy.mjs

      - name: Test
        run: npm test -- --testTimeout=30000

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: release-assets

      - name: Verify release assets and stamp registry metadata
        run: node scripts/check-release-candidate.mjs artifacts --directory release-assets --stamp-registry

      - name: Install the pinned signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        timeout-minutes: 3
        with:
          cosign-release: 'v3.0.6'

      - name: Download and verify the pinned official MCP publisher
        timeout-minutes: 5
        env:
          MCP_PUBLISHER_VERSION: v1.8.6
          MCP_PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340
          MCP_PUBLISHER_BUNDLE_SHA256: 466e5457456905f8a86753bef61abc047497831a728622172bfdc6401bd8c244
        run: |
          set -euo pipefail
          umask 077
          PUBLISHER_DIR="$(mktemp -d "$RUNNER_TEMP/mcp-publisher.XXXXXX")"
          ARCHIVE="$PUBLISHER_DIR/mcp-publisher_linux_amd64.tar.gz"
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --max-redirs 5 --connect-timeout 15 --max-time 60 --retry 1 --retry-max-time 90 --proto '=https' --proto-redir '=https' --tlsv1.2 --max-filesize 16777216 "$BASE/mcp-publisher_linux_amd64.tar.gz" -o "$ARCHIVE"
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$ARCHIVE" | sha256sum --check --status
          curl --fail --location --max-redirs 5 --connect-timeout 15 --max-time 60 --retry 1 --retry-max-time 90 --proto '=https' --proto-redir '=https' --tlsv1.2 --max-filesize 65536 "$BASE/mcp-publisher_linux_amd64.tar.gz.sigstore.json" -o "$ARCHIVE.sigstore.json"
          printf '%s  %s\n' "$MCP_PUBLISHER_BUNDLE_SHA256" "$ARCHIVE.sigstore.json" | sha256sum --check --status
          timeout 60s cosign verify-blob "$ARCHIVE" --bundle "$ARCHIVE.sigstore.json" --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          ulimit -f 65536
          tar --extract --to-stdout --gzip --file "$ARCHIVE" -- mcp-publisher > "$PUBLISHER_DIR/mcp-publisher"
          test -s "$PUBLISHER_DIR/mcp-publisher"
          chmod 0755 "$PUBLISHER_DIR/mcp-publisher"
          printf 'MCP_PUBLISHER=%s\n' "$PUBLISHER_DIR/mcp-publisher" >> "$GITHUB_ENV"

      - name: Recheck official CI immediately before publication
        timeout-minutes: 3
        run: node scripts/check-release-candidate.mjs source
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to npm (provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to MCP Registry
        run: |
          "$MCP_PUBLISHER" login github-oidc
          "$MCP_PUBLISHER" publish

      # No .tgz asset: this repo uses immutable releases, so assets cannot be
      # attached after the release is published. The package tarball is already
      # distributed via npm (npm install pulls the identical artifact), so a
      # GitHub-release copy is redundant.
      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: release-assets/*
          generateReleaseNotes: true
          draft: false
          prerelease: false
