name: Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
      - name: Create maintenance App token
        if: vars.MAINTENANCE_APP_CLIENT_ID != ''
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.MAINTENANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAINTENANCE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Explain workflow approval requirement
        if: vars.MAINTENANCE_APP_CLIENT_ID == ''
        run: echo '::notice::Configure MAINTENANCE_APP_CLIENT_ID and MAINTENANCE_APP_PRIVATE_KEY to run maintenance PR checks without manual approval.'

      - name: Open changelog PR
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          commit-message: 'docs: update changelog'
          title: 'docs: update changelog'
          body: Auto-generated by [git-cliff](https://github.com/orhun/git-cliff).
          branch: auto/changelog-update
          delete-branch: true
          add-paths: CHANGELOG.md
