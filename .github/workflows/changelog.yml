name: Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
      # main requires status checks on every ref update, so this can no longer
      # push directly (that always failed: "2 of 2 required status checks are
      # expected"). Open a PR instead, same as every other change to main.
      - name: Open changelog PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'docs: update changelog'
          title: 'docs: update changelog'
          body: Auto-generated by [git-cliff](https://github.com/orhun/git-cliff).
          branch: auto/changelog-update
          delete-branch: true
          add-paths: CHANGELOG.md
