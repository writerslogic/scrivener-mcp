name: C2PA source build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: C2PA reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.x
          check-latest: true
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned Rust and wasm-pack
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack --version 0.14.0 --locked
      - name: Rebuild and compare the shipped engine
        run: |
          mkdir -p logs/c2pa-rebuild
          cp assets/c2pa-binding/build.json logs/c2pa-rebuild/expected-build.json
          git rev-parse HEAD > logs/c2pa-rebuild/checkout.sha
          rustc --version --verbose > logs/c2pa-rebuild/compiler.txt
          cargo --version --verbose > logs/c2pa-rebuild/cargo.txt
          npm run build:c2pa > logs/c2pa-rebuild/build.log 2>&1
          cp assets/c2pa-binding/build.json logs/c2pa-rebuild/rebuilt-build.json
          cp -R assets/c2pa-binding logs/c2pa-rebuild/rebuilt
          git diff -- assets/c2pa-binding > logs/c2pa-rebuild/artifact.diff
          node scripts/check-c2pa-binding.mjs
          cmp logs/c2pa-rebuild/expected-build.json assets/c2pa-binding/build.json
          git diff --exit-code --quiet -- assets/c2pa-binding
      - name: Diagnose a nonmatching clean rebuild
        if: failure()
        run: |
          cargo clean --manifest-path native/c2pa-binding/Cargo.toml
          npm run build:c2pa > logs/c2pa-rebuild/repeat-build.log 2>&1
          cp -R assets/c2pa-binding logs/c2pa-rebuild/repeated
          diff -r logs/c2pa-rebuild/rebuilt logs/c2pa-rebuild/repeated > logs/c2pa-rebuild/repeat.diff
      - name: Share the verified engine with dependent jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c2pa-binding
          path: assets/c2pa-binding
          if-no-files-found: error
      - name: Retain reproducible build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: c2pa-rebuild
          path: logs/c2pa-rebuild
          if-no-files-found: error
