reason = "rustix 1.1.4 unsoundness in getxattr/lgetxattr/fgetxattr/listxattr with a zero-length buffer; fixed in 1.1.6. This Cargo.lock is the hash-pinned build record of the published narrative-lens 0.2.0 (see ../upstream.json) and cannot be edited here. rustix is reached through tempfile (create/remove only) and xattr 1.6.1 via tar 0.4.46 via tract-nnef; tar calls only xattr::set (src/entry.rs, unpack with xattrs), never the affected get/list functions. Refresh this record when narrative-lens next publishes with rustix >= 1.1.6."
