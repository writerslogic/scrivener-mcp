[[IgnoredVulns]]
id = "RUSTSEC-2026-0486"
ignoreUntil = 2027-02-01
reason = "rustix 1.1.5 unsoundness in getxattr/lgetxattr/fgetxattr/listxattr with a zero-length buffer; fixed in 1.1.6. These CycloneDX inventories are hash-pinned records of the published writerslogic-warm 0.7.0 (see ../upstream.json) and cannot be edited here. In the Warm native binary rustix is reached only through tempfile 3.27.0, which calls rustix open/rename/renameat/unlink/fstat and no xattr function. Drop this entry when a writerslogic-warm release ships rustix >= 1.1.6 and these inventories are regenerated."
