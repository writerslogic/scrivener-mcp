[package]
name = "scrivener-c2pa-binding"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
c2pa = { version = "=0.91.7", default-features = false, features = ["rust_native_crypto", "pdf", "file_io"] }
serde_json = "1.0.150"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
async-trait = "0.1.89"
js-sys = "0.3.77"
pem = "4.0.0"
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
c2pa = { path = ".sdk/c2pa-0.91.7" }
